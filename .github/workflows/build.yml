name: Build Dont Pull Me More Players

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Add BepInEx NuGet source
        shell: pwsh
        run: dotnet nuget add source https://nuget.bepinex.dev/v3/index.json --name BepInEx
      - name: Restore
        run: dotnet restore DontPullMeMorePlayers.csproj
      - name: Build Release
        run: dotnet build DontPullMeMorePlayers.csproj -c Release --no-restore
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\DontPullMeMorePlayers | Out-Null
          Copy-Item bin\Release\net6.0\DontPullMeMorePlayers.dll package\DontPullMeMorePlayers\DontPullMeMorePlayers.dll
          Copy-Item README.md package\DontPullMeMorePlayers\README.txt
          Compress-Archive -Path package\DontPullMeMorePlayers -DestinationPath DontPullMeMorePlayers_8Players_v1.0.6.zip -Force
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: DontPullMeMorePlayers-v1.0.6
          path: |
            package/DontPullMeMorePlayers/DontPullMeMorePlayers.dll
            DontPullMeMorePlayers_8Players_v1.0.6.zip
          if-no-files-found: error
